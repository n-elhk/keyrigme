<div class="show-result-container">
  <h1 class="result-title" id="result-title">Résultats</h1>
  <div class="result-wrapper">
    <table mat-table [dataSource]="results()" aria-labelledby="result-title">
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef scope="col">Rang</th>
        <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
      </ng-container>

      <ng-container matColumnDef="avatar">
        <th mat-header-cell *matHeaderCellDef scope="col">Avatar</th>
        <td mat-cell *matCellDef="let element">
          <cf-avatar [width]="30" [height]="30" [src]="element.avatar" />
        </td>
      </ng-container>

      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef scope="col">Pseudo</th>
        <td mat-cell *matCellDef="let element">{{ element.username }}</td>
      </ng-container>

      <ng-container matColumnDef="point">
        <th mat-header-cell *matHeaderCellDef scope="col">Points</th>
        <td mat-cell *matCellDef="let element">{{ element.point }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        class="row-body"
        *matRowDef="let row; columns: displayedColumns; let i = index"
        [style.--sibling-index]="i + 1"
      ></tr>
    </table>
  </div>
  <div class="result-actions">
    @if (isOwner()) {
      <button mat-flat-button type="button" [disabled]="pending()" (click)="replay()">Rejouer</button>
    } @else {
      <p role="status">En attente de l'hôte pour une nouvelle partie…</p>
      <button mat-stroked-button type="button" [disabled]="pending()" (click)="leaveRoom()">Quitter</button>
    }
  </div>
  <p class="error-message" role="alert">{{ errorMessage() }}</p>
</div>
