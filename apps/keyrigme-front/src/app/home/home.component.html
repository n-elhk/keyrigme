<div class="home-container">
  <h1 class="home-title">
    <img
      class="home-logo"
      ngSrc="images/logo/keyrigme.png"
      width="1024"
      height="514"
      priority
      alt="Keyrigme"
    />
  </h1>
  <section class="home-content">
    <mat-card>
      <mat-card-content>
        <app-avatar-stepper [(selectedIndex)]="selectedIndexAvatar">
          @for (item of avatars; track item) {
            <cdk-step>
              <cf-avatar [src]="item" [width]="130" [height]="130" />
            </cdk-step>
          }
        </app-avatar-stepper>

        <form>
          <mat-form-field appearance="outline">
            <mat-label>CHOISIS UN SURNOM</mat-label>

            <input
              type="text"
              id="username"
              autocomplete="nickname"
              matInput
              [formField]="form.username"
            />
          </mat-form-field>
        </form>

        <div class="start-game-container">
          @if (code()) {
            <button
              type="button"
              mat-flat-button
              [disabled]="opening() || !form.username().valid() || !form.code().valid()"
              (click)="joinRoom()"
            >
              Rejoindre
            </button>
          } @else {
            <button
              type="button"
              mat-flat-button
              [disabled]="opening() || !form.username().valid()"
              (click)="createRoom()"
            >
              Démarrer
            </button>
          }
        </div>
        <p class="error-message" role="alert">{{ errorMessage() }}</p>
      </mat-card-content>
    </mat-card>

    <mat-card class="guides-card">
      <mat-card-header>
        <h2 mat-card-title>Comment jouer ?</h2>
      </mat-card-header>

      <mat-card-content>
        <app-game-guide-stepper>
          @for (guide of guides; let i = $index; track guide) {
            <cdk-step>
              <div class="guide-item">
                <img [ngSrc]="guide.src" width="100" height="80" alt="" />
                <h3>{{ i + 1 }}. {{ guide.title }}</h3>
                <p>{{ guide.description }}</p>
              </div>
            </cdk-step>
          }
        </app-game-guide-stepper>
      </mat-card-content>
    </mat-card>
  </section>
</div>
