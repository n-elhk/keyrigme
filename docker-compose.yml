services:
  postgres:
    image: postgres:19-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keyrigme}
      POSTGRES_USER: ${POSTGRES_USER:-keyrigme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keyrigme}
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg-data:
    driver: local
